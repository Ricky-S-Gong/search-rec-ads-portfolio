experiment:
  owner: Ricky
  dataset: KuaiRand-Pure
  seed: 42
model:
  item_factory: recommender.item_tower:build_item_tower
  user_embedding_dim: 32
  context_embedding_dim: 8
  num_tabs: 15
  timezone_offset_minutes: 0
  output_dim: 64
  hidden_dims:
  - 128
  - 64
  dropout: 0.0
  batch_norm: false
  history_pooling: none
  item_categorical_embedding_dim: 8
  item_categorical_features:
  - item_id
  - author_id
  - video_type
  - upload_type
  - music_id
  - music_type
  - tag
  item_numeric_features:
  - video_duration
  - server_width
  - server_height
  - upload_day
training:
  device: cuda
  mixed_precision: true
  deterministic: true
  cache_row_groups: 4
  optimizer: adam
  learning_rate: 0.001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0
  batch_size: 256
  epochs: 1
  temperature: 0.1
  log_every_steps: 50
  checkpoint_every_steps: 500
