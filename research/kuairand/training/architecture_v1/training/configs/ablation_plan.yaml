# All runs use ablation_control.yaml unless an override below changes one factor.
# The runner adds the control once; do not duplicate a default setting here.
base_config: ablation_control.yaml
groups:
  architecture:
    arch_a0_shallow_mean:
      model: {history_encoder: mean, user_hidden: [128, 64], item_hidden: [64], batch_norm: false, residual_blocks: 0}
    arch_a1_deep_mean:
      model: {history_encoder: mean, batch_norm: false, residual_blocks: 0}
    arch_a2_deep_attention:
      model: {history_encoder: attention, batch_norm: false, residual_blocks: 0}
    arch_a3_attention_residual:
      model: {history_encoder: attention, batch_norm: false, residual_blocks: 1}
    arch_a5_lstm_residual_bn:
      model: {history_encoder: lstm}
  hyperparameters:
    hp_lr_0003:
      training: {learning_rate: 0.0003}
    hp_lr_003:
      training: {learning_rate: 0.003}
    hp_dropout_000:
      model: {dropout: 0.0}
    hp_dropout_020:
      model: {dropout: 0.2}
    hp_wd_1e5:
      training: {weight_decay: 0.00001}
    hp_wd_1e4:
      training: {weight_decay: 0.0001}
    hp_temp_005:
      training: {temperature: 0.05}
    hp_temp_020:
      training: {temperature: 0.2}
  sampling:
    sample_s0_none:
      training: {sampling_correction: none, sampling_logq_alpha: 0.0, sampling_logq_smoothing: 0.0}
    sample_s1_logq_half:
      training: {sampling_correction: logq, sampling_logq_alpha: 0.5, sampling_logq_smoothing: 0.0}
    sample_s3_logq_laplace:
      training: {sampling_correction: logq, sampling_logq_alpha: 1.0, sampling_logq_smoothing: 1.0}
