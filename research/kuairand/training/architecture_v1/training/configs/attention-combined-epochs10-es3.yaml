experiment:
  seed: 42
  dataset: KuaiRand-1K
model:
  item_categorical_features:
  - item_id
  - author_id
  - video_type
  - upload_type
  - music_id
  - music_type
  - tag
  item_numeric_features:
  - video_duration
  - server_width
  - server_height
  - upload_day
  category_dim: 8
  user_dim: 32
  tab_dim: 8
  output_dim: 64
  history_length: 50
  history_encoder: attention
  user_hidden:
  - 256
  - 128
  - 64
  item_hidden:
  - 128
  - 64
  batch_norm: true
  dropout: 0.1
  residual_blocks: 1
  attention_heads: 4
  behavior_content_features: true
training:
  device: cuda
  deterministic: true
  mixed_precision: true
  batch_size: 256
  epochs: 10
  learning_rate: 0.001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0
  temperature: 0.1
  log_every: 50
  checkpoint_every: 1000
  early_stopping_patience: 3
evaluation:
  candidate_rule: upload_next_day
  query_batch_size: 128
  item_batch_size: 16384
  k: 100
  output_dim: 64
wandb:
  mode: online
  entity: SAR-Lab
  project: kuairand-two-tower
  name: 1k-attention-deeper-residual-bn-d01-lr0.001-bs256-e10-es3-seed42
  group: week2-1k-content
  tags:
  - 1k
  - content-15-features
  - manual
  - deeper
  - behavior-content-v2
  - attention
  - residual
  - batchnorm
  - combined
  - dropout-0.1
  - epochs-10
  - early-stopping-3
