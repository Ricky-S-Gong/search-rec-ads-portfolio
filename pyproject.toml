[project]
name = "search-rec-ads-portfolio"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["research/spotify-music/tests", "research/movielens-cf/tests"]
