name: KuaiRand training checks

on:
  pull_request:
    paths:
      - 'research/kuairand/**'
      - '.github/workflows/kuairand-training.yml'
  push:
    branches: [main]
    paths:
      - 'research/kuairand/**'
      - '.github/workflows/kuairand-training.yml'

permissions:
  contents: read

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/kuairand/training
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run --locked ruff check . --exclude vendor
      - run: uv run --locked pytest tests -q
